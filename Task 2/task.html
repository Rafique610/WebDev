<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archery Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Top Controls -->
        <div class="topControls">
            <button id="startButton" class="startButton">Start Game</button>

            <div class="timerDisplay"><span id="timer">01:00</span></div>

            <div class="difficultyControls">
                <button id="easy" class="speedButton">Easy</button>
                <button id="medium" class="speedButton">Medium</button>
                <button id="hard" class="speedButton">Hard</button>
            </div>
        </div>

        <!-- Score -->
        <div class="scoreSection">
            <h2>Score: <span id="score">0</span></h2>
        </div>

        <!-- Game Area -->
        <div class="gameScreenContainer">
            <div id="gameArea" class="movingDiv">
                <div id="gameImage" href="target.png"></div>
            </div>

            <div id="arrow"></div>

        </div>

    </div>

    <!-- Game Over Popup -->
    <div id="gameOverPopup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close" id="closePopup">&times;</button>
            <h2>Game Over!</h2>
            <div class="popup-stats">
                <p><strong>Final Score:</strong> <span id="popupScore">0</span></p>
                <p><strong>Difficulty:</strong> <span id="popupDifficulty">Easy</span></p>
            </div>
        </div>
    </div>

    <script>
    // ==========================================
    // GAME STATE VARIABLES
    // ==========================================
    let y = 0;
    const baseStep = 5;
    let currentStep = baseStep;
    let gameInterval = null;
    let isGameRunning = false;
    let score = 0;

    let arrowActive = false;
    let arrowX = 0;
    let arrowY = 0;
    let arrowInterval = null;

    let timeRemaining = 60;
    let timerInterval = null;

    const minSpeed = 1;
    const maxSpeed = 8;
    let speedMultiplier = 1;
    let scoreMultiplier = 1;
    let currentDifficulty = "easy";

    // Target size tracking
    const initialTargetSize = 70;
    let currentTargetSize = initialTargetSize;

    // ==========================================
    // DOM ELEMENT REFERENCES
    // ==========================================
    const gameImageEl = document.getElementById("gameImage");
    const gameArea = document.getElementById("gameArea");
    const gameScreen = document.querySelector(".gameScreenContainer");
    const startBtn = document.getElementById("startButton");
    const difficultyButtons = document.querySelectorAll(".speedButton");
    const scoreDisplay = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const arrow = document.getElementById("arrow");

    // ==========================================
    // INITIALIZATION
    // ==========================================
    const initializeGame = () => {
        if (gameImageEl) {
            gameImageEl.style.backgroundImage = "url(target.png)";
        }
        updateTimerDisplay();
    };

    // ==========================================
    // TIMER FUNCTIONS
    // ==========================================
    const updateTimerDisplay = () => {
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        if (timerEl) {
            timerEl.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        }
    };

    const startTimer = () => {
        timeRemaining = 60;
        updateTimerDisplay();
        timerInterval = setInterval(decrementTimer, 1000);
    };

    const stopTimer = () => {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    };

    const decrementTimer = () => {
        timeRemaining--;
        updateTimerDisplay();

        if (timeRemaining <= 0) {
            endGame();
        }
    };

    // ==========================================
    // SCORE FUNCTIONS
    // ==========================================
    const updateScore = () => {
        score += scoreMultiplier;
        if (scoreDisplay) {
            scoreDisplay.textContent = score;
        }
        increaseDifficulty();
    };

    // ==========================================
    // DIFFICULTY FUNCTIONS
    // ==========================================
    const increaseDifficulty = () => {
        // Progressive difficulty based on score milestones
        const milestones = [5, 10, 15, 20, 25];
        
        if (milestones.includes(score)) {
            // Increase speed gradually
            speedMultiplier = Math.min(maxSpeed, speedMultiplier + 0.4);
            currentStep = baseStep * speedMultiplier;
            
            // Shrink target size
            currentTargetSize = Math.max(40, currentTargetSize - 5);
            gameArea.style.width = currentTargetSize + "px";
            gameArea.style.height = currentTargetSize + "px";
            
            // Change color based on difficulty level
            if (score >= 20) {
                gameArea.style.backgroundColor = "#ff4444"; // Red - hardest
            } else if (score >= 15) {
                gameArea.style.backgroundColor = "#ff8844"; // Orange
            } else if (score >= 10) {
                gameArea.style.backgroundColor = "#ffbb44"; // Yellow-orange
            } else if (score >= 5) {
                gameArea.style.backgroundColor = "#ffd93d"; // Yellow
            }
        }
    };

    const setDifficulty = (difficulty) => {
        currentDifficulty = difficulty;

        switch (difficulty) {
            case "easy":
                speedMultiplier = 1;
                scoreMultiplier = 1;
                break;
            case "medium":
                speedMultiplier = 2;
                scoreMultiplier = 2;
                break;
            case "hard":
                speedMultiplier = 3;
                scoreMultiplier = 3;
                break;
        }

        currentStep = baseStep * speedMultiplier;
    };

    // ==========================================
    // GAME CONTROL FUNCTIONS
    // ==========================================
    const resetGame = () => {
        score = 0;
        if (scoreDisplay) {
            scoreDisplay.textContent = score;
        }
        
        timeRemaining = 60;
        updateTimerDisplay();
        
        y = 0;
        
        // Reset target size and color
        currentTargetSize = initialTargetSize;
        gameArea.style.width = currentTargetSize + "px";
        gameArea.style.height = currentTargetSize + "px";
        gameArea.style.backgroundColor = "#e0e0e0";
        
        // Reset speed to current difficulty base
        setDifficulty(currentDifficulty);
    };

    const startGame = () => {
        isGameRunning = true;
        startBtn.textContent = "Stop Game";
        startBtn.classList.add("activeDifficulty");

        resetGame();
        gameScreen.classList.add("gameRunning");
        
        gameInterval = setInterval(moveTarget, 30);
        startTimer();
    };

    const stopGame = () => {
        isGameRunning = false;
        startBtn.textContent = "Start Game";
        startBtn.classList.remove("activeDifficulty");

        gameScreen.classList.remove("gameRunning");
        
        if (gameInterval) {
            clearInterval(gameInterval);
            gameInterval = null;
        }
        
        stopTimer();
        resetGame();
    };

    const endGame = () => {
        isGameRunning = false;
        
        if (gameInterval) {
            clearInterval(gameInterval);
            gameInterval = null;
        }
        
        stopTimer();
        
        startBtn.textContent = "Start Game";
        startBtn.classList.remove("activeDifficulty");
        
        gameScreen.classList.remove("gameRunning");
        
        showGameOverPopup();
        
        timeRemaining = 60;
        updateTimerDisplay();
    };

    const toggleGameState = () => {
        if (isGameRunning) {
            stopGame();
        } else {
            startGame();
        }
    };

    // ==========================================
    // TARGET MOVEMENT FUNCTION
    // ==========================================
    const moveTarget = () => {
        const maxY = gameScreen.offsetHeight;

        y += currentStep;

        // When target goes out of bounds, respawn from top
        if (y > maxY) {
            y = -gameArea.offsetHeight;
        }

        gameArea.style.top = y + "px";
    };

    // ==========================================
    // ARROW FUNCTIONS
    // ==========================================
    const shootArrow = (e) => {
        if (!isGameRunning) return;
        if (arrowActive) return;

        const rect = gameScreen.getBoundingClientRect();
        const clickY = e.clientY - rect.top;

        arrowX = 0;
        arrowY = clickY - arrow.offsetHeight / 2;

        arrow.style.left = arrowX + "px";
        arrow.style.top = arrowY + "px";
        arrow.style.display = "block";

        arrowActive = true;
        arrowInterval = setInterval(moveArrow, 15);
    };

    const moveArrow = () => {
        const gameWidth = gameScreen.offsetWidth;

        arrowX += 10;

        arrow.style.left = arrowX + "px";

        // Check collision with target
        if (checkCollision()) {
            updateScore();
            stopArrow();
        }

        // Check if arrow went off screen
        if (arrowX > gameWidth) {
            stopArrow();
        }
    };

    const stopArrow = () => {
        if (arrowInterval) {
            clearInterval(arrowInterval);
            arrowInterval = null;
        }

        arrow.style.display = "none";
        arrowActive = false;
    };

    const checkCollision = () => {
        const arrowRect = arrow.getBoundingClientRect();
        const targetRect = gameArea.getBoundingClientRect();

        return (
            arrowRect.right >= targetRect.left &&
            arrowRect.left <= targetRect.right &&
            arrowRect.bottom >= targetRect.top &&
            arrowRect.top <= targetRect.bottom
        );
    };

    // ==========================================
    // POPUP FUNCTIONS
    // ==========================================
    const showGameOverPopup = () => {
        const popup = document.getElementById("gameOverPopup");
        const popupScore = document.getElementById("popupScore");
        const popupDifficulty = document.getElementById("popupDifficulty");
        
        if (popupScore) {
            popupScore.textContent = score;
        }
        
        const difficultyNames = {
            "easy": "Easy",
            "medium": "Medium",
            "hard": "Hard"
        };
        
        if (popupDifficulty) {
            popupDifficulty.textContent = difficultyNames[currentDifficulty] || "Easy";
        }
        
        if (popup) {
            popup.style.display = "flex";
        }
    };

    const hideGameOverPopup = () => {
        const popup = document.getElementById("gameOverPopup");
        if (popup) {
            popup.style.display = "none";
        }
    };

    // ==========================================
    // EVENT LISTENERS
    // ==========================================
    
    // Start/Stop button
    if (startBtn) {
        startBtn.addEventListener("click", toggleGameState);
    }

    // Difficulty buttons
    difficultyButtons.forEach((button) => {
        button.addEventListener("click", (e) => {
            // Prevent event bubbling
            e.stopPropagation();
            
            // Update active button styling
            difficultyButtons.forEach((btn) => {
                btn.classList.remove("activeDifficulty");
            });
            button.classList.add("activeDifficulty");

            // Stop current game if running
            if (isGameRunning) {
                stopGame();
            }

            // Set new difficulty
            setDifficulty(button.id);
        });
    });

    // Game screen click to shoot arrow
    gameScreen.addEventListener("click", shootArrow);

    // Popup close button
    const closePopupBtn = document.getElementById("closePopup");
    if (closePopupBtn) {
        closePopupBtn.addEventListener("click", hideGameOverPopup);
    }

    // Close popup when clicking outside
    const popupOverlay = document.getElementById("gameOverPopup");
    if (popupOverlay) {
        popupOverlay.addEventListener("click", (e) => {
            if (e.target === popupOverlay) {
                hideGameOverPopup();
            }
        });
    }

    // ==========================================
    // INITIALIZE ON LOAD
    // ==========================================
    initializeGame();
    </script>

</body>

</html>
